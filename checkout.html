<!DOCTYPE html>
<html>
  <head>
    <!-- ==================== METADATA & HEAD ==================== -->
    <title>Swapify - Browse Listings</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- ==================== AUTH & SCRIPT LOGIC ==================== -->
    <script>
      // ==================== ACCESS CONTROL ====================
      if (localStorage.getItem("loggedIn") !== "true") {
        alert("You must sign in to access this page.");
        window.location.href = "signin.html";
      }

      // ==================== DOM MANIPULATION ON LOAD ====================
      document.addEventListener("DOMContentLoaded", function () {
        const nav = document.querySelector(".navbar nav");
        nav.style.position = "absolute";
        nav.style.top = "10px";
        nav.style.left = "50%";
        nav.style.transform = "translateX(-50%)";
      });

      // ==================== CLASS: Favorites ====================
      class Favorites {
        constructor() {
          this.key = "favorites";
          this.favorites = JSON.parse(localStorage.getItem(this.key)) || [];
        }

        add(itemName, itemImage, button) {
          if (!this.favorites.find(item => item.name === itemName)) {
            this.favorites.push({ name: itemName, image: itemImage });
            localStorage.setItem(this.key, JSON.stringify(this.favorites));
            button.style.color = "black";
            button.style.backgroundColor = "red";
            alert(`${itemName} has been added to your favorites.`);
          } else {
            alert(`${itemName} is already in your favorites.`);
          }
        }

        remove(itemName) {
          this.favorites = this.favorites.filter(item => item.name !== itemName);
          localStorage.setItem(this.key, JSON.stringify(this.favorites));
          this.view();
        }

        view() {
          const container = document.getElementById("favoritesContainer");
          container.innerHTML = "";
          if (this.favorites.length === 0) {
            container.innerHTML = "<p>Your favorites list is empty.</p>";
          } else {
            const ul = document.createElement("ul");
            this.favorites.forEach(item => {
              const li = document.createElement("li");
              li.innerHTML = `
                <img src="${item.image}" alt="${item.name}" style="width: 50px; height: 50px; margin-right: 10px;">
                ${item.name}
                <button onclick="favorites.remove('${item.name}')">Remove</button>
              `;
              ul.appendChild(li);
            });
            container.appendChild(ul);
          }
          document.getElementById("favoritesModal").style.display = "block";
        }

        close() {
          document.getElementById("favoritesModal").style.display = "none";
        }
      }

      // ==================== CLASS: Cart ====================
      class Cart {
        constructor() {
          this.key = "cart";
          this.cart = JSON.parse(localStorage.getItem(this.key)) || [];
        }

        add(itemName, itemImage) {
          this.cart.push({ name: itemName, image: itemImage });
          localStorage.setItem(this.key, JSON.stringify(this.cart));
          alert(`${itemName} has been added to your cart.`);
        }

        remove(itemName) {
          this.cart = this.cart.filter(item => item.name !== itemName);
          localStorage.setItem(this.key, JSON.stringify(this.cart));
          this.view();
        }

        view() {
          const container = document.getElementById("cartContainer");
          container.innerHTML = "";
          if (this.cart.length === 0) {
            container.innerHTML = "<p>Your cart is empty.</p>";
          } else {
            const ul = document.createElement("ul");
            this.cart.forEach(item => {
              const li = document.createElement("li");
              li.innerHTML = `
                <img src="${item.image}" alt="${item.name}" style="width: 50px; height: 50px; margin-right: 10px;">
                ${item.name}
                <button onclick="cart.remove('${item.name}')">Remove</button>
              `;
              ul.appendChild(li);
            });
            container.appendChild(ul);
          }
          document.getElementById("cartModal").style.display = "block";
        }

        close() {
          document.getElementById("cartModal").style.display = "none";
        }
      }

      // ==================== INSTANTIATE OBJECTS ====================
      const favorites = new Favorites();
      const cart = new Cart();

      // ==================== SEARCH FUNCTIONALITY ====================
      function searchItems() {
        const query = document.getElementById("searchBar").value.toLowerCase();
        const listings = document.querySelectorAll(".listing");
        listings.forEach(listing => {
          const itemName = listing.querySelector("strong").innerText.toLowerCase();
          listing.style.display = itemName.includes(query) ? "block" : "none";
        });
      }
    </script>
  </head>

  <body>
    <!-- ==================== NAVIGATION BAR ==================== -->
    <header class="navbar">
      <img src="images/logo.png" alt="Swapify Logo" class="nav-logo" />
      <nav>
        <a href="index.html">Home</a>
        <a href="signin.html">Sign In</a>
        <a href="signup.html">Sign Up</a>
      </nav>
      <div style="position: absolute; top: 10px; right: 20px; display: flex; gap: 10px;">
        <img src="images/heart-icon.png" alt="Favorites Icon" class="icon-img" onclick="favorites.view()" style="cursor: pointer;" />
        <img src="images/cart-icon.png" alt="Cart Icon" class="icon-img" onclick="cart.view()" style="cursor: pointer;" />
      </div>
    </header>

    <!-- ==================== LISTINGS HEADER & SEARCH ==================== -->
    <h1>Browse Listings</h1>
    <input type="text" id="searchBar" placeholder="Search items..." onkeyup="searchItems()" />

    <!-- ==================== PRODUCT LISTINGS ==================== -->
    <ul id="listings">
      <li class="listing">
        <img src="images/item1.jpg" alt="Item 1" class="listing-img" style="width: 150px; height: 150px; object-fit: cover;" />
        <strong>Item 1</strong> - $10
        <button onclick="cart.add('Item 1', 'images/item1.jpg')">Add to Cart</button>
        <span onclick="favorites.add(this, 'Item 1', 'images/item1.jpg')" style="cursor: pointer; font-size: 24px; color: black; background-color: white; border: 1px solid black; border-radius: 50%; padding: 5px;">&#9829;</span>
      </li>

      <li class="listing">
        <img src="images/item2.jpg" alt="Item 2" class="listing-img" style="width: 150px; height: 150px; object-fit: cover;" />
        <strong>Item 2</strong> - $15
        <button onclick="cart.add('Item 2', 'images/item2.jpg')">Add to Cart</button>
        <span onclick="favorites.add(this, 'Item 2', 'images/item2.jpg')" style="cursor: pointer; font-size: 24px; color: black; background-color: white; border: 1px solid black; border-radius: 50%; padding: 5px;">&#9829;</span>
      </li>

      <li class="listing">
        <img src="images/item3.jpg" alt="Item 3" class="listing-img" style="width: 150px; height: 150px; object-fit: cover;" />
        <strong>Item 3</strong> - $20
        <button onclick="cart.add('Item 3', 'images/item3.jpg')">Add to Cart</button>
        <span onclick="favorites.add(this, 'Item 3', 'images/item3.jpg')" style="cursor: pointer; font-size: 24px; color: black; background-color: white; border: 1px solid black; border-radius: 50%; padding: 5px;">&#9829;</span>
      </li>
    </ul>

    <!-- ==================== CART MODAL ==================== -->
    <div id="cartModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border: 2px solid #ddd; padding: 20px; border-radius: 10px; z-index: 1000; max-width: 400px; text-align: center;">
      <h2>Your Cart</h2>
      <div id="cartContainer"></div>
      <button onclick="cart.close()">Close</button>
    </div>

    <!-- ==================== FAVORITES MODAL ==================== -->
    <div id="favoritesModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border: 2px solid #ddd; padding: 20px; border-radius: 10px; z-index: 1000; max-width: 400px; text-align: center;">
      <h2>Your Favorites</h2>
      <div id="favoritesContainer"></div>
      <button onclick="favorites.close()">Close</button>
    </div>
  </body>
</html>
