<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ==================== METADATA & HEAD ==================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Swapify - Checkout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ==================== NAVIGATION BAR ==================== -->
    <header class="navbar">
      <div class="nav-left">
        <img src="images/logo.png" alt="Swapify Logo" class="nav-logo" />
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="browse.html">Browse</a>
        </nav>
      </div>
    </header>

    <!-- ==================== CHECKOUT FORM ==================== -->
    <main class="form-container">
      <h1>Checkout</h1>
      <form id="checkoutForm" class="form">
        <input type="text" id="cardName" placeholder="Name on Card" required />
        <input type="text" id="cardNumber" placeholder="Card Number" required maxlength="19" />
        <input type="text" id="expiration" placeholder="MM/YY" required maxlength="5" />
        <input type="text" id="cvv" placeholder="CVV" required maxlength="4" />
        <button type="submit">Complete Purchase</button>
      </form>
    </main>

    <!-- ==================== CHECKOUT SCRIPT ==================== -->
    <script>
      document.getElementById("checkoutForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const cardNumber = document.getElementById("cardNumber").value.trim();
        const cardName = document.getElementById("cardName").value.trim();
        const expiration = document.getElementById("expiration").value.trim();
        const cvv = document.getElementById("cvv").value.trim();

        if (!cardName || !cardNumber || !expiration || !cvv) {
          alert("Please fill out all fields.");
          return;
        }

        if (!/^\d{16}$/.test(cardNumber.replace(/\s+/g, ''))) {
          alert("Invalid card number. Use 16 digits.");
          return;
        }

        if (!/^\d{2}\/\d{2}$/.test(expiration)) {
          alert("Expiration should be in MM/YY format.");
          return;
        }

        if (!/^\d{3,4}$/.test(cvv)) {
          alert("Invalid CVV.");
          return;
        }

        // ==================== PURCHASE PROCESSING ====================
        const purchased = JSON.parse(localStorage.getItem("cart")) || [];
        const customListings = JSON.parse(localStorage.getItem("customListings")) || [];

        const updatedListings = customListings.filter(
          listing => !purchased.some(item => item.name === listing.title)
        );

        localStorage.setItem("customListings", JSON.stringify(updatedListings));
        localStorage.removeItem("cart");

        alert("Payment successful! Your items have been purchased.");
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
